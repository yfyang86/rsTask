[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rstask-core = { path = "crates/rstask-core" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "macros",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
ratatui = "0.29"
crossterm = "0.28"
blake3 = "1"
postcard = { version = "1", features = ["use-std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
# P2P transport (PRD-v2 D1). Same pin and feature set as cSharing, minus
# `unstable-net-report`; no post-quantum key exchange, no relay server.
iroh = { version = "=1.3.0", default-features = false, features = [
    "metrics",
    "fast-apple-datapath",
    "portmapper",
    "tls-aws-lc-rs",
] }
