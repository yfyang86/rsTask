[package]
name = "rstask-core"
description = "RsTask core: models, SQLite storage, actor/claim/event semantics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
sqlx.workspace = true
tracing.workspace = true
blake3.workspace = true
postcard.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
hex.workspace = true
iroh = { workspace = true, optional = true }

[features]
# iroh QUIC transport (`net.rs`). Off by default: only the CLI turns it on, so
# the MCP server, REST server and TUI do not build the network stack.
net = ["dep:iroh"]
